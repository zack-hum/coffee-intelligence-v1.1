name: Bug report
description: Something is broken or shows wrong data
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dev.bat live`
        2. Open the Origins page
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [demo, live, cloud (Cloud Run)]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Browser console errors, server output, or the error shown on the Sources page. Remove any API keys first.
      render: text
